name: pr-check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

    - name: Set up Elixir
      uses: erlef/setup-beam@e6d7c94229049569db56a7ad5a540c051a010af9 # 1.20.4
      env:
        ImageOS: ubuntu24 # This shouldn't be required but there's an error otherwise.
      with:
        elixir-version: '1.18.4'
        otp-version: 'OTP-27.0'

    - name: Install dependencies
      run: mix deps.get

    - name: Run tests
      run: mix test

    - name: Check format
      run: |
        mix format
        git diff --exit-code
